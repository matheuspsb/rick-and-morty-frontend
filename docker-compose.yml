# Sobe backend + frontend juntos. Assume que os dois repositórios foram
# clonados lado a lado na mesma pasta pai:
#
#   algum-diretorio/
#     rick-and-morty-backend/
#     rick-and-morty-frontend/   (este repositório)
#
# Rode `docker compose up --build` a partir de qualquer um dos dois repos
# (o arquivo é idêntico nos dois).

services:
  backend:
    build:
      context: ../rick-and-morty-backend
    ports:
      - "3000:3000"
    environment:
      BASE_URL: ${BASE_URL:-https://rickandmortyapi.com/api}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/character/1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ../rick-and-morty-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
